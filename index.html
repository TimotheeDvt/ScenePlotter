<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ProStage Plotter -- Timothée D.</title>
    <script src="https://unpkg.com/konva@10/konva.min.js"></script>
    <script src="svgs.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar-left">
        <div class="panel">
            <h3>Stage Plotter</h3>
            <input type="text" id="projName">
            <div class="toggle-container">
                <label style="margin:0; font-size: 10px;">Cables Orthogonaux</label>
                <label class="switch">
                    <input type="checkbox" id="orthoToggle" onchange="isOrtho = this.checked; updateAllCables();">
                    <span class="slider"></span>
                </label>
            </div>
            <button onclick="saveStage()">Exporter .stage</button>
            <button style="background:#444" onclick="document.getElementById('loadInput').click()">Charger une scène</button>
            <input type="file" id="loadInput" style="display:none" onchange="loadStage(event)">
        </div>
        <div id="library-container" style="flex-grow: 1; overflow-y: auto;"> </div>
        <div class="panel" style="border-top: 1px solid #333; border-bottom: none; margin-top: auto;">
            <div style="display: flex; gap: 8px;">
                <button style="background:#444; font-size: 10px; padding: 5px;" onclick="setAllCategories(true)">Tout cacher</button>
                <button style="background:#444; font-size: 10px; padding: 5px;" onclick="setAllCategories(false)">Tout déplier</button>
            </div>
        </div>
</div>
    </div>

    <div id="canvas-container"></div>

    <div id="sidebar-right" style="display: flex;">
        <h3 id="prop-title">Propriétés du Canevas</h3>

        <div id="canvas-props">
            <label>Couleur de fond</label>
            <input type="color" id="canvas-bg-color" value="#333333" style="padding: 2px;">
            <div class="toggle-container">
                <label style="margin:0; font-size: 10px;">Afficher la Grille</label>
                <label class="switch">
                    <input type="checkbox" id="gridToggle" checked onchange="toggleGrid(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <label>Largeur (cm)</label>
            <input type="number" id="canvas-width-cm" value="50">
            <label>Hauteur (cm)</label>
            <input type="number" id="canvas-height-cm" value="30">
            <button style="background:#555; margin-top:10px" onclick="centerStage()">Recentrer la scène</button>
        </div>

        <div id="gear-props" style="display:none;">
            <label>Nom de l'élément</label>
            <input type="text" id="prop-label">
            <label>Taille (cm)</label>
            <input type="number" id="prop-size-cm" step="0.1">
            <div style="display: flex; gap: 10px;">
                <div style="flex:1">
                    <span style="display: flex; gap: 5px; margin-bottom: 5px;">
                        <label style="margin-bottom: 0;">Inputs</label>
                        <div style="background:#3498db; aspect-ratio: 1; border-radius: 50%; width: 15px;"></div>
                    </span>
                    <input type="number" id="prop-in" min="0" max="20">
                </div>
                <div style="flex:1">
                    <span style="display: flex; gap: 5px; margin-bottom: 5px;">
                        <label style="margin-bottom: 0;">Outputs</label>
                        <div style="background:#e74c3c; aspect-ratio: 1; border-radius: 50%; width: 15px;"></div>
                    </span>
                    <input type="number" id="prop-out" min="0" max="20">
                </div>
            </div>
        </div>

        <div id="cable-props" style="display:none;">
            <label>Label du câble</label>
            <input type="text" id="cable-label">
            <label>Couleur du câble</label>
            <input type="color" id="cable-color-picker" style="padding: 2px;">
        </div>

        <div id="selection-actions" style="display:none;">
            <button style="background:#e74c3c; margin-top:20px" id="btn-delete">Supprimer (Suppr)</button>
            <button style="background:#444; margin-top:5px" onclick="deselectAll()">Désélectionner</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
